<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1e">
<meta name="robots" content="noindex,nofollow">
<title>Piyu Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#040a1c;--card:rgba(255,255,255,.07);--line:rgba(125,185,255,.2);--tx:#eef6ff;--mut:#9ab4d9;--ok:#38d996;--warn:#ffb84d;--bad:#ff5c6c;
--gold1:#b8860b;--gold2:#ffd76a;--gold3:#fff3b0;--blue1:#1d4ed8;--blue2:#38bdf8;--blue3:#bae6fd;font-family:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx)}
body{background:radial-gradient(900px 560px at 80% -8%,rgba(56,189,248,.34),transparent 62%),radial-gradient(760px 560px at -12% 18%,rgba(29,78,216,.42),transparent 60%),radial-gradient(700px 520px at 50% 115%,rgba(255,200,80,.14),transparent 60%),var(--bg);background-attachment:fixed;background-size:140% 140%,140% 140%,140% 140%,auto;animation:aurora 24s ease-in-out infinite alternate}
@keyframes aurora{0%{background-position:0% 0%,100% 0%,50% 100%,0 0}100%{background-position:100% 60%,0% 70%,60% 0%,0 0}}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx i{position:absolute;bottom:-12px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 12px 2px rgba(125,211,252,.7);animation:floatUp linear infinite}.fx i.g{background:#ffd76a;box-shadow:0 0 12px 2px rgba(255,215,106,.7)}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-108vh) translateX(40px);opacity:0}}
@keyframes goldflow{0%{background-position:0% 0}100%{background-position:-220% 0}}
@keyframes blueflow{0%{background-position:-220% 0}100%{background-position:0% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes ping{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes blip{0%,12%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1.5)}45%,100%{opacity:0;transform:scale(1)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* running lines */
.lines{position:relative}.lines::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold1),var(--gold2),var(--gold3),var(--gold2),var(--gold1),transparent);background-size:220% 100%;animation:goldflow 3.2s linear infinite}
.lines::before{content:'';position:absolute;left:0;right:0;bottom:3px;height:2px;background:linear-gradient(90deg,transparent,var(--blue1),var(--blue2),var(--blue3),var(--blue2),var(--blue1),transparent);background-size:220% 100%;animation:blueflow 4.4s linear infinite;opacity:.9}
/* login */
#login{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:20px}
.lbox{width:min(420px,100%);padding:30px 24px;border-radius:28px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .6s both}
.lbox h1{font-size:30px;background:linear-gradient(90deg,#3da9ff,#22d3ee,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0 4px}
.lbox p{color:var(--mut);margin-bottom:16px}
.orb{position:relative;width:96px;height:96px;margin:30px auto 20px}
.orb>i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#3da9ff,#22d3ee,#ffd166,#3da9ff);animation:spin 6s linear infinite}
.orb>i:nth-of-type(2){inset:-8px;filter:blur(12px);opacity:.45}.orb>i:nth-of-type(3){inset:14px;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.1) 60%);animation:none}
.radar{position:absolute;inset:-38%;border-radius:50%;pointer-events:none}
.radar::before,.radar::after{content:'';position:absolute;border-radius:50%;border:2px solid transparent}
.radar::before{inset:0;border-top-color:#ffd76a;border-right-color:rgba(255,215,106,.45);animation:spin 3.4s linear infinite;filter:drop-shadow(0 0 7px rgba(255,215,106,.95))}
.radar::after{inset:7%;border-bottom-color:#38bdf8;border-left-color:rgba(56,189,248,.45);animation:spinr 4.6s linear infinite;filter:drop-shadow(0 0 7px rgba(56,189,248,.95))}
.radar .rg{position:absolute;inset:21.6%;border-radius:50%;border:2px solid rgba(56,189,248,.65);opacity:0;animation:ping 3.6s cubic-bezier(.2,.6,.3,1) infinite}.radar .rg.g{border-color:rgba(255,215,106,.7);animation-delay:1.2s}.radar .rg:nth-child(3){animation-delay:2.4s}
.radar .sweep{position:absolute;inset:7%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg 250deg,rgba(56,189,248,.05) 250deg,rgba(56,189,248,.38) 330deg,rgba(255,215,106,.85) 360deg);-webkit-mask:radial-gradient(circle,transparent 0 33%,#000 34%);mask:radial-gradient(circle,transparent 0 33%,#000 34%);animation:spin 2.8s linear infinite}
.radar .blip{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd76a;box-shadow:0 0 10px 3px rgba(255,215,106,.9);opacity:0;animation:blip 5.6s ease-in-out infinite}.radar .b1{top:18%;left:78%}.radar .b2{top:72%;left:20%;animation-delay:1.9s;background:#7dd3fc}.radar .b3{top:30%;left:12%;animation-delay:3.7s}
input,select,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(255,215,106,.18)}
select option{color:#000}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;padding:10px 16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);box-shadow:0 6px 18px rgba(14,165,233,.3);transition:transform .15s,filter .2s;display:inline-block}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.95)}
.btn.gold{color:#1b1200;background:linear-gradient(110deg,#b8860b 0%,#ffd76a 12.5%,#fff3b0 25%,#ffd76a 37.5%,#b8860b 50%,#ffd76a 62.5%,#fff3b0 75%,#ffd76a 87.5%,#b8860b 100%);background-size:200% 100%;animation:btnflow 3.4s linear infinite;box-shadow:0 6px 22px rgba(255,183,3,.4)}
@keyframes btnflow{to{background-position:-100% 0}}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}.btn.bad{background:linear-gradient(135deg,#b91c1c,#ef4444)}.btn.ok{background:linear-gradient(135deg,#047857,#34d399)}.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:11px}.btn.wide{width:100%;padding:13px}
.msg{min-height:20px;margin:8px 0;font-size:13px;color:var(--bad)}
.lmode{display:flex;gap:6px;margin:0 0 14px;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.lmode button{flex:1;border:0;background:none;color:var(--mut);padding:9px 6px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px;transition:all .25s}.lmode button.on{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;box-shadow:0 4px 14px rgba(14,165,233,.4)}
/* app shell */
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 20px 12px;background:rgba(5,12,34,.78);backdrop-filter:blur(16px);margin:0 -14px}
.logo{position:relative;width:38px;height:38px;flex:none}.logo>i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#3da9ff,#22d3ee,#ffd166,#3da9ff);animation:spin 6s linear infinite}.logo>i+i{inset:8px;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.1) 60%);animation:none}
header h1{font-size:18px;flex:1}header h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.live{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(56,217,150,.14);border:1px solid rgba(56,217,150,.4);font-size:12.5px}.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.4s infinite}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);padding:9px 16px;border-radius:14px;cursor:pointer;font-weight:600;transition:all .25s;position:relative}
.tab.on{color:#fff;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);border-color:transparent;box-shadow:0 4px 18px rgba(14,165,233,.4)}
.tab .bdg{display:inline-block;margin-left:6px;min-width:18px;padding:1px 6px;border-radius:99px;background:var(--gold2);color:#1b1200;font-size:11px;font-weight:800;animation:pulse 1.6s infinite}
main>section{animation:rise .5s both}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{position:relative;padding:16px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.28);overflow:hidden;transition:transform .25s,box-shadow .25s;animation:rise .55s both}
.card::before{content:'';position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--gold2),var(--blue2),var(--gold2),transparent);background-size:240% 100%;animation:goldflow 5s linear infinite;opacity:.85}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(0,0,0,.35),0 0 26px rgba(56,189,248,.14)}
.card h3{font-size:14px;color:var(--blue3);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi{text-align:center;padding:18px 10px}.kpi b{display:block;font-size:32px;line-height:1.1;background:linear-gradient(90deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}.kpi span{font-size:12px;color:var(--mut)}.kpi .ic{font-size:22px;margin-bottom:4px;display:block}
.kpi.gold b{background:linear-gradient(90deg,#fff3b0,#ffd76a);-webkit-background-clip:text;background-clip:text}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}.row:first-child{border-top:0}.row .g{flex:1;min-width:0}.row small{display:block;color:var(--mut);font-size:11.5px}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:700}
.pill.pending{background:rgba(255,184,77,.22);color:#ffd38a}.pill.approved{background:rgba(56,189,248,.2);color:#bae6fd}.pill.active{background:rgba(56,217,150,.2);color:#8df0c8}.pill.revoked{background:rgba(255,92,108,.22);color:#ff9aa6}.pill.student{background:rgba(255,215,106,.2);color:#ffe28a}.pill.business{background:rgba(139,92,255,.25);color:#d5c6ff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#64748b}.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.4s infinite}
.bar{position:relative;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#1d4ed8,#38bdf8,#ffd166);background-size:200% 100%;animation:goldflow 2.4s linear infinite;box-shadow:0 0 10px rgba(56,189,248,.7);transition:width 1s cubic-bezier(.2,.8,.2,1);width:0}
.bar.bad i{background:linear-gradient(90deg,#b91c1c,#ff5c6c,#ffb84d)}.bar.warn i{background:linear-gradient(90deg,#b45309,#ffb84d,#ffe28a)}.bar.good i{background:linear-gradient(90deg,#047857,#38d996,#9df0cc)}
.ring{position:relative;width:86px;height:86px;display:grid;place-items:center;margin:0 auto}.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ring .t{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}.ring .f{fill:none;stroke:#38bdf8;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(56,189,248,.8));transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}.ring.warn .f{stroke:#ffb84d}.ring.bad .f{stroke:#ff5c6c}.ring.good .f{stroke:#38d996}
.ring b{font-size:17px;position:relative}.gauge{text-align:center}.gauge small{display:block;color:var(--mut);margin-top:6px;font-size:12px}
.chart{height:170px;display:flex;align-items:flex-end;gap:5px;padding-top:10px}.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}.chart .b{width:100%;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#38bdf8,#1d4ed8);transform-origin:bottom;animation:bar .8s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 14px rgba(56,189,248,.45)}.chart .b.y{background:linear-gradient(180deg,#ffd76a,#b8860b);box-shadow:0 0 14px rgba(255,215,106,.5)}.chart small{font-size:9.5px;color:var(--mut)}.chart .v{font-size:10px;color:var(--blue3)}
.rad{position:relative;width:170px;height:170px;margin:6px auto}.rad .radar{inset:-4%}.rad .dotb{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px 4px rgba(56,217,150,.9);animation:pulse 1.4s infinite;transform:translate(-50%,-50%)}
.flag{font-size:18px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.uc{cursor:pointer}.uc .top{display:flex;gap:12px;align-items:center}.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:conic-gradient(from 0deg,#3da9ff,#22d3ee,#ffd166,#3da9ff);color:#06112b;flex:none;position:relative}.av .dot{position:absolute;right:-1px;bottom:-1px;border:2px solid #0a1636}
.uc h4{font-size:16px}.uc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.uc .st{margin-top:10px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12px;color:var(--mut)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(2,6,20,.72);backdrop-filter:blur(6px);display:flex;justify-content:flex-end;animation:fade .25s}
.dr{width:min(760px,100%);height:100%;overflow:auto;padding:16px 16px 60px;background:linear-gradient(180deg,#0a1636,#050b1e);border-left:1px solid var(--line);animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.dr .hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}.dr .hd h2{font-size:20px;flex:1}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer;font-size:16px}
.tok{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:rgba(0,0,0,.35);border:1px dashed rgba(255,215,106,.5);padding:9px 10px;border-radius:12px;word-break:break-all;color:var(--gold3)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}.sw:first-child{border-top:0}
.sw label{position:relative;width:48px;height:26px;flex:none;margin:0}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .tr{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15);transition:background .25s;cursor:pointer}.sw .tr::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.sw input:checked+.tr{background:linear-gradient(135deg,#047857,#38d996);box-shadow:0 0 14px rgba(56,217,150,.5)}.sw input:checked+.tr::after{transform:translateX(22px)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.kv div{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;word-break:break-word}.kv small{display:block;color:var(--mut);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl td,.tbl th{padding:7px 6px;border-top:1px solid rgba(255,255,255,.06);text-align:left;vertical-align:top}.tbl th{color:var(--mut);font-weight:600;font-size:11px}
.tw{overflow-x:auto}
.sec{margin-top:14px}
dialog{border:1px solid var(--line);border-radius:24px;background:#0b1a3c;color:var(--tx);width:min(520px,94vw);padding:18px;box-shadow:0 0 0 1px rgba(255,215,106,.2),0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}dialog label{display:block;margin:10px 0;color:var(--mut);font-size:13px}
dialog h3{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#0b1a3c;border:1px solid var(--gold2);padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .3s both}
.empty{padding:22px;text-align:center;color:var(--mut)}
.confetti{position:fixed;inset:0;z-index:95;pointer-events:none}
@media (max-width:560px){.users{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.dr{padding:12px 12px 60px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.alangs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}.alangs button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px}.alangs button.on{background:linear-gradient(135deg,#1d4ed8,#22d3ee);border-color:transparent;font-weight:700}.alangSel{width:auto;padding:7px 10px;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>

<div id="login">
  <div class="lbox">
    <div class="orb"><div class="radar"><span class="rg"></span><span class="rg g"></span><span class="rg"></span><span class="sweep"></span><span class="blip b1"></span><span class="blip b2"></span><span class="blip b3"></span></div><i></i><i></i><i></i></div>
    <h1>Piyu Admin</h1>
    <div class="alangs" data-keep></div>
    <div class="lmode"><button type="button" class="on" data-m="mail">✉ Email + Password</button><button type="button" data-m="pin">🔑 Owner PIN / token</button></div>
    <div id="lMail"><input id="lemail" type="email" autocomplete="username" placeholder="Email" spellcheck="false"><input id="lpass" type="password" autocomplete="current-password" placeholder="Password" style="margin-top:10px"></div>
    <div id="lPin" hidden><input id="tok" type="password" autocomplete="off" placeholder="Owner PIN / token" spellcheck="false"></div>
    <div class="msg" id="lmsg" role="status"></div>
    <button class="btn gold wide" id="lgo">🔓 Login</button>
  </div>
</div>

<div id="app" hidden>
  <header class="lines">
    <div class="logo"><i></i><i></i></div>
    <h1>Piyu Admin<small id="sub">—</small></h1>
    <select id="alang" class="alangSel" title="Language" aria-label="Language" data-keep></select>
    <div class="live" id="liveb"><i></i><span id="liven">0</span> online</div>
    <button class="x" id="out" title="Logout">⎋</button>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="dash">📊 Dashboard</button>
    <button class="tab" data-t="users">👥 Users <span class="bdg" id="pendb" hidden></span></button>
    <button class="tab" data-t="sec">🛡 Security</button>
    <button class="tab" data-t="logs">📜 Logs</button>
    <button class="tab" data-t="set">⚙ Settings</button>
  </div>
  <main>
    <section id="p-dash"></section>
    <section id="p-users" hidden></section>
    <section id="p-sec" hidden></section>
    <section id="p-logs" hidden></section>
    <section id="p-set" hidden></section>
  </main>
</div>

<div id="drawer" class="drawer" hidden><div class="dr" id="dr"></div></div>

<dialog id="newDlg">
  <h3>➕ नया user</h3>
  <label>नाम<input id="nuName" placeholder="जैसे: Rahul Sharma"></label>
  <label>Mobile (WhatsApp)<input id="nuPhone" type="tel" placeholder="98765 43210"></label>

<script src="i18n/admin.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- language of the panel (Hindi is the source; en / bn / mr / ur from i18n/admin.js) ---------------- */
const ALANGS = [['hi', 'हिन्दी'], ['en', 'English'], ['bn', 'বাংলা'], ['mr', 'मराठी'], ['ur', 'اردو']];
let ALANG = 'hi'; try { ALANG = localStorage.getItem('piyu.alang') || 'hi'; } catch (e) { }
if (!ALANGS.some(x => x[0] === ALANG)) ALANG = 'hi';
const DEVRX = /[\u0900-\u097F]/, RULES = {};
function rulesFor(l) {
  if (RULES[l]) return RULES[l];

  return RULES[l] = Object.keys(d).sort((a, b) => b.length - a.length).map(k => {
    let n = 0; const src = k.replace(/[.*+?^$()|[\]\\]/g, '\\$&').replace(/\{(\d+)\}/g, () => { n++; return '(\\{\\d+\\})'; });
    const a = DEVRX.test(k[0]) ? '(?<![\\u0900-\\u097F])' : '', z = DEVRX.test(k[k.length - 1]) ? '(?![\\u0900-\\u097F])' : '';

/* translate one string: numbers are lifted out, every phrase is replaced once (longest first), numbers are put back */

}
const ORIG = new WeakMap(), ATTR = ['placeholder', 'title'];
let busy = false;
function trNode(root) {
  if (busy) return; busy = true;

      const v = e.getAttribute(k); if (v == null) return; const key = 'o' + k, o = e.dataset[key] !== undefined && e.dataset['t' + k] === v ? e.dataset[key] : v;
      if (!DEVRX.test(o) && e.dataset[key] === undefined) return; e.dataset[key] = o; const out = T(o); e.dataset['t' + k] = out; if (out !== v) e.setAttribute(k, out);
    }));

}
const mo = new MutationObserver(ms => { if (busy) return; ms.forEach(m => { if (m.type === 'childList') m.addedNodes.forEach(n => { if (n.nodeType === 1) trNode(n); else if (n.nodeType === 3 && n.parentNode) trNode(n.parentNode); }); else if (m.type === 'characterData' && m.target.parentNode) trNode(m.target.parentNode); }); });
function setALang(l) {

  document.documentElement.lang = l; document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';
  $$('.alangs').forEach(b => { b.innerHTML = ALANGS.map(([k, n]) => `<button type="button" data-l="${k}" class="${k === l ? 'on' : ''}">${n}</button>`).join(''); });
  const sel = $('#alang'); if (sel) { sel.innerHTML = ALANGS.map(([k, n]) => `<option value="${k}" ${k === l ? 'selected' : ''}>${n}</option>`).join(''); }
  trNode(document.body); document.title = 'Piyu Admin';
}
document.addEventListener('click', e => { const b = e.target.closest('.alangs [data-l]'); if (b) setALang(b.dataset.l); });
document.addEventListener('change', e => { if (e.target.id === 'alang') setALang(e.target.value); });

async function api(path, opt) {
  const o = Object.assign({ headers: {} }, opt || {}); o.headers = Object.assign(SESS ? { 'X-Piyu-Admin': SESS } : { 'X-Piyu-Token': TOKEN }, o.headers);
  if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers['Content-Type'] = 'application/json'; o.method = o.method || 'POST'; delete o.json; }
  const raw = o.raw; delete o.raw;
  const r = await fetch(path, o);
  if (r.status === 401 || (r.status === 403 && path.indexOf('/admin') > 0)) { const e = new Error('auth'); e.status = r.status; throw e; }
  return raw ? r : r.json();
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = T(m); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const fmtDur = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + 'h ' + m + 'm' : m ? m + 'm' : s + 's'; };
const ago = ts => { if (!ts) return '—'; const d = (Date.now() - ts) / 1000; return d < 60 ? 'अभी' : d < 3600 ? Math.floor(d / 60) + ' min पहले' : d < 86400 ? Math.floor(d / 3600) + ' घंटे पहले' : Math.floor(d / 86400) + ' दिन पहले'; };
const when = ts => ts ? new Date(ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const flag = cc => cc && /^[A-Za-z]{2}$/.test(cc) ? String.fromCodePoint(...cc.toUpperCase().split('').map(c => 127397 + c.charCodeAt(0))) : '🌐';
const place = x => [x.city, x.country].filter(Boolean).join(', ') || (x.cc === '--' ? 'Local network' : 'पता नहीं');
const shortUA = ua => { ua = ua || ''; const mdl = (ua.match(/;\s*([A-Za-z0-9\-]{4,14}) Build\//) || [])[1]; const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : ''; const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : ''; return [os, mdl, br].filter(Boolean).join(' · ') || '—'; };
function countUp(el, to, ms) { const t0 = performance.now(); (function f(t) { const k = Math.min(1, (t - t0) / (ms || 900)), v = to * (1 - Math.pow(1 - k, 3)); el.textContent = Math.round(v); if (k < 1) requestAnimationFrame(f); else el.textContent = Math.round(to); })(t0); }
function animateAll(root) { (root || document).querySelectorAll('[data-n]').forEach(n => countUp(n, +n.dataset.n)); requestAnimationFrame(() => requestAnimationFrame(() => { (root || document).querySelectorAll('.bar i[data-w]').forEach(i => i.style.width = i.dataset.w + '%'); (root || document).querySelectorAll('.ring .f[data-to]').forEach(c => c.style.strokeDashoffset = c.dataset.to); })); }
const bar = (f, cls) => `<div class="bar ${cls || ''}"><i data-w="${Math.round(Math.max(0, Math.min(1, f || 0)) * 100)}"></i></div>`;
function ringSvg(f, label, sub, cls) { const r = 34, c = 2 * Math.PI * r; return `<div class="gauge"><div class="ring ${cls || ''}"><svg viewBox="0 0 80 80"><circle class="t" cx="40" cy="40" r="${r}"/><circle class="f" cx="40" cy="40" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" data-to="${(c * (1 - Math.max(0, Math.min(1, f)))).toFixed(1)}"/></svg><b>${label}</b></div><small>${sub}</small></div>`; }
function mountFX() { const fx = $('#fx'); if (fx.children.length) return; for (let i = 0; i < 16; i++) { const s = document.createElement('i'); s.style.cssText = `left:${Math.round(Math.random() * 100)}%;animation-duration:${14 + Math.random() * 16}s;animation-delay:${-Math.random() * 20}s;width:${3 + Math.random() * 5}px;height:${3 + Math.random() * 5}px;opacity:${0.25 + Math.random() * 0.4}`; if (i % 3 === 0) s.className = 'g'; fx.appendChild(s); } }
function confetti() { if (matchMedia('(prefers-reduced-motion:reduce)').matches) return; const cv = document.createElement('canvas'); cv.className = 'confetti'; cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv); const x = cv.getContext('2d'), cols = ['#ffd166', '#3da9ff', '#4ee1c1', '#fff']; const ps = Array.from({ length: 90 }, () => ({ x: cv.width / 2, y: cv.height * .6, vx: (Math.random() - .5) * 13, vy: -Math.random() * 14 - 4, r: 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * 4)], a: 1 })); let f = 0; (function s() { x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.vy += .36; p.x += p.vx; p.y += p.vy; p.a -= .008; x.globalAlpha = Math.max(0, p.a); x.fillStyle = p.c; x.fillRect(p.x, p.y, p.r * 2, p.r); }); if (++f < 140) requestAnimationFrame(s); else cv.remove(); })(); }

/* ---------------- login ---------------- */
$$('.lmode button').forEach(b => b.onclick = () => { LMODE = b.dataset.m; $$('.lmode button').forEach(x => x.classList.toggle('on', x === b)); $('#lMail').hidden = LMODE !== 'mail'; $('#lPin').hidden = LMODE !== 'pin'; $('#lmsg').textContent = ''; });
async function login(auto) {
  $('#lmsg').textContent = '';
  if (!auto) {
    if (LMODE === 'mail') {
      const em = $('#lemail').value.trim(), pw = $('#lpass').value;
      if (!em || !pw) { $('#lmsg').textContent = '⚠ Email और Password दोनों डालिए'; return; }
      let r; try { r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: em, password: pw }) }); } catch (e) { $('#lmsg').textContent = '⚠ Server तक नहीं पहुँच पा रही'; return; }
      if (r.status === 429) { $('#lmsg').textContent = '⚠ बहुत ज़्यादा कोशिशें — थोड़ी देर बाद फिर कीजिए'; return; }
      if (!r.ok) { $('#lmsg').textContent = '⚠ Email या Password सही नहीं है'; return; }

$('#lgo').onclick = () => login(); $('#lemail').onkeydown = $('#lpass').onkeydown = $('#tok').onkeydown = e => { if (e.key === 'Enter') login(); };

function render() { if (!ST.ov) return; ({ dash: rDash, users: rUsers, sec: rSec, logs: rLogs, set: rSet })[tab](); }

/* ---------------- dashboard ---------------- */
function rDash() {

/* ---------------- security / logs / settings ---------------- */
function rSec() { const o = ST.ov; $('#p-sec').innerHTML = `<div class="grid g2"><div class="card"><h3>🛡 Security घटनाएँ</h3>${secList(o.security)}</div><div class="card"><h3>🔐 हाल के logins</h3>${o.logins.length ? o.logins.map(l => `<div class="row"><span class="flag">${flag(l.cc)}</span><div class="g"><b>${esc((ST.users.find(u => u.id === l.uid) || { name: l.uid ? '#' + l.uid : 'Owner' }).name)}</b><small>${esc(place(l))} · ${esc(l.ip)} · ${esc(shortUA(l.ua))} · ${when(l.at)}</small></div></div>`).join('') : '<div class="empty">—</div>'}</div></div>`; }
function rLogs() { const o = ST.ov; $('#p-logs').innerHTML = `<div class="card"><h3>📜 Admin की गतिविधि (audit)</h3>${o.audit.length ? `<div class="tw"><table class="tbl"><tr><th>कब</th><th>क्या</th><th>किसके लिए</th><th>विवरण</th></tr>${o.audit.map(a => `<tr><td>${when(a.at)}</td><td><b>${esc(a.action)}</b></td><td>${esc(a.target)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</table></div>` : '<div class="empty">—</div>'}<p style="color:var(--mut);font-size:12px;margin-top:8px">🔒 Passwords कभी log में नहीं लिखे जाते।</p></div>`; }
function rSet() {
  const o = ST.ov;
  $('#p-set').innerHTML = `<div class="grid g2"><div class="card"><h3>📢 सभी users को संदेश (announcement)</h3><textarea id="ann" rows="3" maxlength="300" placeholder="जैसे: कल रात 10 बजे maintenance होगा">${esc(o.announcement || '')}</textarea><div class="acts"><button class="btn gold sm" id="annSave">📤 भेजें</button><button class="btn ghost sm" id="annClr">हटाएँ</button></div><p style="color:var(--mut);font-size:12px;margin-top:8px">यह हर user को app में ऊपर दिखता है।</p></div>
  <div class="card"><h3>✉ Admin login (Email + Password)</h3><p style="color:var(--mut);font-size:13px">अभी: <b>${esc(o.adminEmail || 'सेट नहीं')}</b>. बदलने पर पुराने सारे login बंद हो जाते हैं। Owner PIN / token से login हमेशा चलता रहेगा।</p><label style="display:block;margin:8px 0;color:var(--mut);font-size:12px">Email<input id="cEmail" type="email" value="${esc(o.adminEmail || '')}" autocomplete="off"></label><label style="display:block;margin:8px 0;color:var(--mut);font-size:12px">नया Password (कम से कम 8 अक्षर)<input id="cPass" type="password" autocomplete="new-password"></label><div class="msg" id="cMsg"></div><div class="acts"><button class="btn gold sm" id="cSave">💾 सेट करें</button></div></div>
  <div class="card"><h3>💾 Backup</h3><p style="color:var(--mut);font-size:13px">सारे databases (आपका, users के, access registry) की एक zip file — सुरक्षित जगह रखिए, इसमें सबके tokens हैं।</p><div class="acts"><button class="btn sm" id="bk">⬇ Backup download</button></div></div>
  <div class="card"><h3>📍 Tracking के बारे में</h3><p style="color:var(--mut);font-size:13px;line-height:1.55">• हर user की app खुली रहने पर हर 30 सेकंड में एक छोटा संकेत जाता है: कौन सा page खुला है और कितने सेकंड दिखा।<br>• Country/शहर IP address से पता चलता है (मुफ़्त ip-api.com से, एक बार; local server में cache रहता है)। GeoIP अभी: <b>${o.geoip ? 'ON' : 'OFF'}</b>. बंद करने के लिए server पर <code>PIYU_GEOIP=0</code> रखें।<br>• Users को इसकी जानकारी app की Settings में दी जाती है।</p></div></div>`;
  $('#cSave').onclick = async () => { const r = await api('/api/admin/credentials', { json: { email: $('#cEmail').value, password: $('#cPass').value } }); if (r.error) { $('#cMsg').textContent = '⚠ ' + ({ email: 'Email सही नहीं है', weak: 'Password कम से कम 8 अक्षर का हो' }[r.error] || r.error); return; } $('#cPass').value = ''; toast('✅ Admin login सेट हो गया — दोबारा login कीजिए'); SESS = ''; try { localStorage.removeItem('piyu.adminS'); } catch (e) { } setTimeout(() => location.reload(), 1200); };
  $('#annSave').onclick = async () => { await api('/api/admin/announce', { json: { text: $('#ann').value } }); toast('📢 भेज दिया'); refresh(); };
  $('#annClr').onclick = async () => { await api('/api/admin/announce', { json: { text: '' } }); $('#ann').value = ''; toast('हटा दिया'); refresh(); };
  $('#bk').onclick = async () => { const r = await api('/api/admin/backup', { raw: true }); const bl = await r.blob(); const l = document.createElement('a'); l.href = URL.createObjectURL(bl); l.download = 'piyu-backup-' + new Date().toISOString().slice(0, 10) + '.zip'; l.click(); toast('⬇ Backup बन गया'); };
}
mountFX();
setALang(ALANG); mo.observe(document.body, { childList: true, subtree: true, characterData: true });
if (SESS || TOKEN) login(true);
</script>
</body>
</html>
