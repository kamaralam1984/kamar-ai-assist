<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Piyu Admin</title>
<style>
:root{--bg:#0b0a1a;--card:#16132e;--line:#2b2750;--tx:#f1eeff;--mut:#9b94c7;--p1:#ff5fa2;--p2:#8b5cff;--ok:#3ddc97;--warn:#ffb020;--bad:#ff5a6e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(11,10,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:980px;margin:0 auto;padding:14px 14px 80px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;font-weight:600}
.btn.danger{border-color:#7a2033;color:#ffb3bd}.btn.sm{padding:5px 9px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input,select{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-pending{background:#4a3a08;color:var(--warn)}.b-approved{background:#0c3b4a;color:#6fd3ff}.b-active{background:#0b3d2a;color:var(--ok)}.b-revoked{background:#4a1420;color:var(--bad)}
.u{display:grid;gap:8px}
.u h3{margin:0;font-size:17px}.mut{color:var(--mut);font-size:13px}
.tok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;background:rgba(255,255,255,.06);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.stats{display:flex;gap:14px;flex-wrap:wrap}.stats b{color:var(--tx)}
#login{max-width:420px;margin:12vh auto}
.msg{min-height:20px;color:var(--bad);font-size:14px}
.tabs{display:flex;gap:8px;margin:6px 0}.tabs .btn.on{background:var(--p2);border-color:transparent}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2861;border:1px solid var(--line);padding:10px 16px;border-radius:12px;display:none;z-index:20}
.empty{text-align:center;color:var(--mut);padding:28px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="login" class="card">
  <h2 style="margin-top:0">🛠 Piyu Admin</h2>
  <p class="mut">Sirf owner ke liye. Owner token daaliye (wahi jo server ke <code>PIYU_TOKEN</code> me hai).</p>
  <input id="own" type="password" placeholder="Owner token" autocomplete="off">
  <div class="msg" id="lmsg"></div>
  <button class="btn primary" id="lgo" style="width:100%;margin-top:6px">अंदर जाएँ</button>
</div>

<div id="app" class="hide">
  <header>
    <h1>🛠 Piyu Admin <span class="badge b-pending" id="pcount" hidden></span></h1>
    <button class="btn sm" id="refresh">🔄 नया</button>
    <button class="btn sm" id="logout">Logout</button>
  </header>
  <main>
    <div class="card">
      <div class="row"><div class="mut grow">Nayi request aate hi yahan dikhegi. <b>Approve</b> dabane par token dikhega; use user ko phone / WhatsApp par bhejiye. Ek token sirf ek device par chalta hai.</div></div>
      <div class="row" style="margin-top:8px">
        <input class="grow" id="addn" placeholder="Naya user (naam)"><input class="grow" id="addp" placeholder="Mobile (optional)" inputmode="tel">
        <button class="btn primary" id="add">➕ User jodein</button>
      </div>
    </div>
    <div class="row" style="margin:6px 2px">
      <span class="mut">Dikhayein:</span>
      <div class="tabs" id="tabs"></div>
      <span class="mut grow" id="summary" style="text-align:right"></span>
    </div>
    <div id="list"></div>
  </main>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let OWN = '', FILTER = 'all', DATA = { users: [] }, timer = null;
try { OWN = localStorage.getItem('piyu.admin') || ''; } catch (e) { }
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600); };
async function api(path, method, body) {
  const r = await fetch(path, { method: method || 'GET', headers: Object.assign({ 'X-Piyu-Token': OWN }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch (e) { }
  if (r.status === 401 || r.status === 403 || r.status === 429) { const e = new Error(j.error || 'http ' + r.status); e.status = r.status; throw e; }
  if (!r.ok) throw new Error(j.error || 'http ' + r.status);
  return j;
}
const ago = t => { if (!t) return '—'; const s = Math.max(0, (Date.now() - t) / 1000); return s < 90 ? 'abhi' : s < 5400 ? Math.round(s / 60) + ' min pehle' : s < 172800 ? Math.round(s / 3600) + ' ghante pehle' : Math.round(s / 86400) + ' din pehle'; };
const dt = t => t ? new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
const mb = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round((b || 0) / 1024)) + ' KB';
const STAT = { pending: 'इंतज़ार (मंज़ूरी बाकी)', approved: 'मंज़ूर — token अभी use नहीं हुआ', active: 'चालू — एक device से बंधा', revoked: 'बंद किया गया' };

function waLink(u) {
  let p = (u.phone || '').replace(/\D/g, ''); if (p.length === 10) p = '91' + p;
  const msg = `Namaste ${u.name}, aapka Piyu ka token:\n${u.token}\n\nApp kholkar pehli baar login ke baad "Sync token" me ye daaliye. Ye token sirf usi phone par chalega jahan aap pehli baar daalenge. Kisi ko mat dijiye.`;
  return p ? `https://wa.me/${p}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
}
function render() {
  const us = DATA.users.filter(u => FILTER === 'all' || u.status === FILTER);
  const c = { all: DATA.users.length }; DATA.users.forEach(u => c[u.status] = (c[u.status] || 0) + 1);
  $('#tabs').innerHTML = [['all', 'सब'], ['pending', 'इंतज़ार'], ['approved', 'मंज़ूर'], ['active', 'चालू'], ['revoked', 'बंद']].map(([k, n]) => `<button class="btn sm ${FILTER === k ? 'on' : ''}" data-f="${k}">${n} ${c[k] || 0}</button>`).join('');
  $('#tabs').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTER = b.dataset.f; render(); });
  const p = $('#pcount'); p.hidden = !DATA.pending; p.textContent = DATA.pending + ' नई request'; document.title = (DATA.pending ? '(' + DATA.pending + ') ' : '') + 'Piyu Admin';
  $('#summary').textContent = 'कुल ' + DATA.users.length + ' users';
  if (!us.length) { $('#list').innerHTML = '<div class="card empty">कोई user नहीं</div>'; return; }
  $('#list').innerHTML = us.map(u => {
    const tokenShown = u.status !== 'pending';
    const acts = [];
    if (u.status === 'pending') acts.push(`<button class="btn primary" data-a="approve">✅ Approve करें (token दिखाएँ)</button>`);
    if (u.status === 'active' || u.status === 'approved') acts.push(`<button class="btn sm" data-a="reset" title="नया phone / app साफ़ हुआ: अगला device बंध सकेगा">📱 Device reset</button>`);
    if (u.status === 'revoked') acts.push(`<button class="btn sm" data-a="restore">♻ चालू करें</button>`);
    if (u.status !== 'revoked' && u.status !== 'pending') acts.push(`<button class="btn sm danger" data-a="revoke">⛔ बंद करें</button>`);
    if (u.status !== 'pending') acts.push(`<button class="btn sm" data-a="regen" title="पुराना token तुरंत बेकार">🔁 नया token</button>`);
    acts.push(`<button class="btn sm danger" data-a="delete">🗑 हटाएँ</button>`);
    return `<div class="card u" data-id="${u.id}">
      <div class="row"><h3 class="grow">${esc(u.name)}</h3><span class="badge b-${u.status}">${STAT[u.status] || u.status}</span></div>
      <div class="mut">📞 ${u.phone ? esc(u.phone) : 'नंबर नहीं'} · माँगा: ${dt(u.created)} · आख़िरी बार: ${ago(u.lastSeen)}${u.device ? ' · device <code>' + esc(u.device) + '</code> (' + dt(u.bound) + ')' : ''}</div>
      ${u.stats && u.stats.tasks != null ? `<div class="stats mut">📝 <b>${u.stats.tasks}</b> काम · 📄 <b>${u.stats.docs}</b> documents · 💾 <b>${mb(u.stats.bytes)}</b></div>` : ''}
      ${tokenShown ? `<div class="tok" id="t${u.id}">${esc(u.token)}</div>
      <div class="row"><button class="btn sm primary" data-a="copy">📋 Token copy</button>${u.phone ? `<a class="btn sm" href="${waLink(u)}" target="_blank" rel="noopener">💬 WhatsApp</a><a class="btn sm" href="tel:+${(u.phone.length === 10 ? '91' : '') + u.phone}">📞 Call</a>` : `<a class="btn sm" href="${waLink(u)}" target="_blank" rel="noopener">💬 WhatsApp (number chunein)</a>`}</div>` : `<div class="mut">🔒 Token तब तक बेकार है जब तक आप Approve न करें।</div>`}
      <div class="row">${acts.join('')}</div>
      <div class="row"><input class="grow" data-note placeholder="Note (सिर्फ़ आपके लिए)" value="${esc(u.note)}"><button class="btn sm" data-a="note">सहेजें</button></div>
    </div>`;
  }).join('');
  $('#list').querySelectorAll('.u').forEach(card => {
    const id = card.dataset.id, u = DATA.users.find(x => String(x.id) === id);
    card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(u, b.dataset.a, card));
  });
}
async function act(u, a, card) {
  try {
    if (a === 'copy') { try { await navigator.clipboard.writeText(u.token); } catch (e) { const r = document.createRange(); r.selectNodeContents($('#t' + u.id)); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); } return toast('Token copy हो गया'); }
    if (a === 'note') { await api('/api/admin/users/' + u.id + '/note', 'POST', { note: card.querySelector('[data-note]').value }); return toast('Note सहेजा'); }
    if (a === 'delete' && !confirm(u.name + ' और उनका सारा data हमेशा के लिए हटाएँ?')) return;
    if (a === 'revoke' && !confirm(u.name + ' का access बंद करें?')) return;
    if (a === 'regen' && !confirm('नया token बनेगा; पुराना तुरंत बंद। जारी रखें?')) return;
    if (a === 'reset' && !confirm('Device reset: अगला device जो token डालेगा वह बंध जाएगा। जारी रखें?')) return;
    await api('/api/admin/users/' + u.id + '/' + a, 'POST');
    toast({ approve: 'Approve हो गया — token नीचे है', reset: 'Device reset हो गया', revoke: 'बंद कर दिया', restore: 'चालू कर दिया', regen: 'नया token बन गया', delete: 'हटा दिया' }[a] || 'हो गया');
    await load();
  } catch (e) { toast('गड़बड़: ' + e.message); }
}
async function load() {
  try { DATA = await api('/api/admin/users'); render(); $('#login').classList.add('hide'); $('#app').classList.remove('hide'); }
  catch (e) {
    if (e.status) { OWN = ''; try { localStorage.removeItem('piyu.admin'); } catch (x) { } clearInterval(timer); $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#lmsg').textContent = e.status === 429 ? 'बहुत ज़्यादा कोशिशें — कुछ देर बाद फिर कीजिए' : e.status === 403 ? 'यह owner token नहीं है' : 'Token ग़लत है'; }
    else toast('Server से जुड़ नहीं पाई');
  }
}
$('#lgo').onclick = async () => { OWN = $('#own').value.trim(); if (!OWN) return; $('#lmsg').textContent = ''; try { localStorage.setItem('piyu.admin', OWN); } catch (e) { } await load(); if (!$('#app').classList.contains('hide')) { clearInterval(timer); timer = setInterval(load, 15000); } };
$('#own').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lgo').click(); });
$('#refresh').onclick = load;
$('#logout').onclick = () => { OWN = ''; try { localStorage.removeItem('piyu.admin'); } catch (e) { } clearInterval(timer); $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#own').value = ''; };
$('#add').onclick = async () => { const n = $('#addn').value.trim(); if (n.length < 2) return toast('Naam likhiye'); try { await api('/api/admin/users', 'POST', { name: n, phone: $('#addp').value }); $('#addn').value = ''; $('#addp').value = ''; toast('User jod diya — token niche hai'); await load(); } catch (e) { toast('गड़बड़: ' + e.message); } };
if (OWN) { load().then(() => { if (!$('#app').classList.contains('hide')) timer = setInterval(load, 15000); }); }
</script>
</body>
</html>
