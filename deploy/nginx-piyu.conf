# /etc/nginx/sites-available/piyu-HOST  — an ADDITIONAL virtual host: existing sites are not touched.
# certbot (--nginx) adds the HTTPS part and the http->https redirect to this file.
server {
    listen 80;
    server_name HOST;
    client_max_body_size 110m;                    # files up to 100 MB come in (Piyu shrinks photos, scans and Office pictures first)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=()" always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;                      # answers stream word by word (web / local-AI)
        proxy_request_buffering off;              # big uploads are not spooled to disk first
        proxy_read_timeout 180s;
    }
}
